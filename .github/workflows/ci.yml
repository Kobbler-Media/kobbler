name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"

# koblibs is consumed as a sibling checkout, not from crates.io or npm:
# api/Cargo.toml resolves it via sibling `path = "../../koblibs/<crate>"` deps,
# and web/package.json via `"@koblibs/ui": "file:../../koblibs"`. Both need it
# laid out beside this repo, so every job checks out two repositories.
jobs:
  api:
    name: api (rust)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Free runner disk for the tools image and two target dirs
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/swift /usr/local/lib/android
      - uses: actions/checkout@v7
        with:
          path: kobbler
      - uses: actions/checkout@v7
        with:
          repository: Kobbler-Media/koblibs
          path: koblibs
      - name: System build deps (ffmpeg headers + libclang for bindgen)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libavformat-dev libavcodec-dev libavutil-dev libavfilter-dev \
            libswresample-dev libswscale-dev libchromaprint-dev \
            clang libclang-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            kobbler -> target
            kobbler -> target-tools
      - name: fmt
        working-directory: kobbler
        run: cargo fmt --all -- --check
      - name: clippy
        working-directory: kobbler
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: start test backing services (postgres, nats, meilisearch)
        working-directory: kobbler
        run: docker compose -f docker-compose.test.yml up -d --wait
      # The tests pin FFmpeg behaviour (tone-mapped colour tags, MP3 frame exactness)
      # that differs between releases, so they run against the FFmpeg the API image
      # ships rather than the runner's. Pulled when published, built otherwise.
      - name: kobbler-tools image
        working-directory: kobbler
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          if docker pull ghcr.io/kobbler-media/kobbler-tools:latest; then
            docker tag ghcr.io/kobbler-media/kobbler-tools:latest kobbler-tools:latest
          else
            make tools
          fi
      # Own target dir: kob-ffmpeg-sys bindings are generated from the FFmpeg headers
      # present, and cargo does not notice those changing between host and image.
      # A crash in FFmpeg's C code takes the whole test binary down with no Rust backtrace;
      # keep its core so the step after can say where.
      - name: test (in kobbler-tools)
        run: |
          mkdir -p /tmp/cores && chmod 777 /tmp/cores
          sudo sysctl -w kernel.core_pattern=/tmp/cores/core.%e.%p
          docker run --rm --network host --user "$(id -u):$(id -g)" --ulimit core=-1 -v /tmp/cores:/tmp/cores \
            -e HOME=/tmp -e CARGO_HOME=/cargo -e CARGO_TARGET_DIR=/w/kobbler/target-tools \
            -e SQLX_OFFLINE=true -e CARGO_TERM_COLOR=always \
            -e DATABASE_URL_TEST=postgres://kobbler:kobbler@localhost:5433/kobbler_test \
            -e NATS_URL_TEST=nats://localhost:4223 \
            -e MEILI_URL_TEST=http://localhost:7701 \
            -v "$HOME/.cargo:/cargo" -v "$GITHUB_WORKSPACE:/w" -w /w/kobbler \
            kobbler-tools:latest cargo test --all-features
      - name: backtrace of a crashed test binary
        if: failure()
        run: |
          ls /tmp/cores/core.* >/dev/null 2>&1 || { echo "no core dump"; exit 0; }
          docker run --rm -v /tmp/cores:/tmp/cores -v "$GITHUB_WORKSPACE:/w" kobbler-tools:latest bash -c '
            apt-get update -qq >/dev/null && apt-get install -y -qq gdb >/dev/null
            for core in /tmp/cores/core.*; do
              bin=$(ls -t /w/kobbler/target-tools/debug/deps/integration-* | grep -v "\.d$" | head -1)
              gdb -q -batch -ex "info threads" -ex "thread apply all bt 30" "$bin" "$core"
            done'

  web:
    name: web (svelte)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: kobbler
      - uses: actions/checkout@v7
        with:
          repository: Kobbler-Media/koblibs
          path: koblibs
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: install
        working-directory: kobbler/web
        run: npm install --no-audit --no-fund
      - name: check
        working-directory: kobbler/web
        run: npm run check --if-present
      - name: build
        working-directory: kobbler/web
        run: npm run build

  docker:
    name: docker build (smoke test)
    # main is built and pushed by release.yml.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: kobbler
      - uses: actions/checkout@v7
        with:
          repository: Kobbler-Media/koblibs
          path: koblibs
      - name: make tools
        working-directory: kobbler
        run: make tools
      - name: docker compose build
        working-directory: kobbler
        run: docker compose build api web
