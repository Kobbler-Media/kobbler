name: Release images

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io/kobbler-media
  IMAGES: kobbler kobbler-web

# Each arch builds natively and pushes :sha-<short>-<arch>; `manifest` joins them
# under :latest and :sha-<short>. A v* tag builds nothing: `release` points the
# version tags at the image main already built for that commit.
#
# The web image serves kobapp's wasm build at /player/ (`make player`), so kobapp
# is checked out beside koblibs and built with the JDK it needs.
jobs:
  images:
    name: build ${{ matrix.arch }}
    if: github.ref_type != 'tag'
    strategy:
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Free runner disk for the image builds
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/swift
      - uses: actions/checkout@v7
        with:
          path: kobbler
      - uses: actions/checkout@v7
        with:
          repository: Kobbler-Media/koblibs
          path: koblibs
      - uses: actions/checkout@v7
        with:
          repository: Kobbler-Media/kobapp
          path: kobapp
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - name: docker login
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: build + push :sha-<short>-${{ matrix.arch }}
        working-directory: kobbler
        run: make docker-push REGISTRY=$REGISTRY TAG=sha-${GITHUB_SHA::7}-${{ matrix.arch }}
      # CI runs the API tests inside it, to test against the FFmpeg the API ships.
      - name: push kobbler-tools
        if: matrix.arch == 'amd64'
        run: |
          docker tag kobbler-tools:latest "$REGISTRY/kobbler-tools:latest"
          docker push "$REGISTRY/kobbler-tools:latest"

  manifest:
    name: multi-arch :latest
    needs: images
    runs-on: ubuntu-latest
    steps:
      - name: docker login
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: join the arch images
        run: |
          sha="sha-${GITHUB_SHA::7}"
          for img in $IMAGES; do
            docker buildx imagetools create -t "$REGISTRY/$img:latest" -t "$REGISTRY/$img:$sha" \
              "$REGISTRY/$img:$sha-amd64" "$REGISTRY/$img:$sha-arm64"
          done

  release:
    name: release ${{ github.ref_name }}
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: docker login
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: tag the images built from this commit
        run: |
          version="${GITHUB_REF_NAME#v}"
          for img in $IMAGES; do
            docker buildx imagetools create -t "$REGISTRY/$img:$version" -t "$REGISTRY/$img:${version%.*}" \
              "$REGISTRY/$img:sha-${GITHUB_SHA::7}" \
              || { echo "::error::no $img image for ${GITHUB_SHA::7}; tag a commit main has built"; exit 1; }
          done
      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
