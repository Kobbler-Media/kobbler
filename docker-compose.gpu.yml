# Kobbler — optional GPU engines overlay.
#
# Self-hosted inference services that Kobbler will use if you point it at them.
# All of them need an NVIDIA GPU and the NVIDIA container toolkit; none of them
# is required for a working Kobbler.
#
#   tts-breeze        text-to-speech        (config: tts_service_url)
#   stt-parakeet-cpp  speech-to-text        (config: stt_service_url)
#   embed-vision      image (+text) embeddings (config: vision_service_url)
#   embed-text        text embeddings          (config: text_embedding_service_url)
#
# Run it alongside the core stack:
#
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
#
# The matching defaults are already in config/kobbler.toml.example
# (http://tts-breeze:8203, http://stt-parakeet-cpp:8023, http://embed-vision:8080,
# http://embed-text:8080) — services on the same compose network resolve each
# other by service name.
#
# Each service builds from a ggml port maintained outside this repository, pinned
# by the *_REPO / *_REF variables (override them in .env). Model weights are never baked into the images — they are
# either bind-mounted from the host or downloaded into a named volume on first
# start, so nothing licence-encumbered ends up in an image layer.

services:
  # BreezeTTS 2 on ggml. Exposes /v1/audio/speech (wav | pcm | SSE with
  # interleaved alignment events) and /v1/audio/voices CRUD with multipart
  # voice cloning.
  #
  # Breeze-TTS-2 weights are research / non-commercial licensed. Check the
  # licence before using this for anything but personal evaluation.
  tts-breeze:
    image: kobbler-tts-breeze:latest
    build:
      context: ./docker/tts-breeze
      args:
        BREEZE_REPO: "${BREEZE_REPO:-https://github.com/dbrain/hbd-qwen3-tts.cpp.git}"
        BREEZE_REF: "${BREEZE_REF:-d022511}"
        BREEZE_CUDA_ARCHS: "${BREEZE_CUDA_ARCHS:-86;89;120}"
    init: true
    restart: unless-stopped
    ports:
      - "${TTS_BREEZE_PORT:-8803}:8203"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - breeze-voices:/app/voices
      - ${BREEZE_MODELS_DIR:-./data/models}:/models:ro
    environment:
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      BREEZE_MODEL: "${BREEZE_MODEL:-breeze-tts-2-v2-Q4_K_M.gguf}"
      # Keeps the ~926 MiB text encoder in host RAM. Bit-identical audio, ~1.7%
      # slower, and it is what keeps streaming long-form under ~2.3 GiB VRAM.
      BREEZE_TEXT_ENC_CPU: "${BREEZE_TEXT_ENC_CPU:-1}"
      BREEZE_WORKER_ISOLATION: "1"
      BREEZE_IDLE_UNLOAD_SECONDS: "${BREEZE_IDLE_UNLOAD_SECONDS:-300}"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8203/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Parakeet-TDT speech-to-text on ggml (CrispASR). Used for audiobook
  # transcripts and video subtitle generation. The image downloads its own GGUF
  # on first request into the parakeet-cpp-models volume.
  stt-parakeet-cpp:
    image: kobbler-stt-parakeet:latest
    build:
      context: ./docker/stt-parakeet-cpp
      args:
        PARAKEET_REPO: "${PARAKEET_REPO:-https://github.com/dbrain/hbd-CrispASR.git}"
        PARAKEET_REF: "${PARAKEET_REF:-457252dd}"
        PARAKEET_CUDA_ARCHS: "${PARAKEET_CUDA_ARCHS:-86;89;120}"
        PARAKEET_FORCE_MMQ: "${PARAKEET_FORCE_MMQ:-OFF}"
    init: true
    restart: unless-stopped
    ports:
      - "${STT_PARAKEET_PORT:-8023}:8023"
    environment:
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      # Lowercase, matched against the model registry's HF filenames:
      # q4_k (smallest) / q5_0 / q8_0 / f16.
      PARAKEET_MODEL_QUANT: ${PARAKEET_MODEL_QUANT:-q8_0}
      PARAKEET_LAZY_LOAD: "1"
      PARAKEET_IDLE_UNLOAD_SECONDS: "${PARAKEET_IDLE_UNLOAD_SECONDS:-300}"
      PARAKEET_WORKER_ISOLATION: "${PARAKEET_WORKER_ISOLATION:-1}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - parakeet-cpp-models:/root/.cache/huggingface
      # Read-only view of the library so transcription can read source audio.
      - ${KOBBLER_MEDIA_ROOT:-./data/media}:/media:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8023/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  # EmbeddingGemma-2 on the stock llama.cpp server image: one 768-d space for
  # video frames, posters, summaries and search queries. Used by skip detection
  # (credit text, post-credits), live TV ad detection and semantic search. The
  # entrypoint fetches the GGUFs into the embed-models volume on first start
  # (see EMBED_HF_REPO in .env.example). Use Q8_0 weights: F16 produces NaNs.
  #
  # embed-vision embeds images (70 vision tokens each, ~1.1 GB VRAM) and serves
  # text too when embed-text is not running.
  embed-vision:
    image: "${EMBED_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-cuda}"
    init: true
    restart: unless-stopped
    ports:
      - "${EMBED_VISION_PORT:-18894}:8080"
    entrypoint: ["/bin/sh", "/embed/entrypoint.sh"]
    command: >
      -m /models/${EMBED_MODEL_FILE:-embeddinggemma-2-Q8_0.gguf}
      --mmproj /models/${EMBED_MMPROJ_FILE:-mmproj-Q8_0.gguf}
      --embeddings -ngl 99
      --image-max-tokens 70
      -c 8192 --parallel 4 -b 1024 -ub 1024
      --host 0.0.0.0 --port 8080
    environment:
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      EMBED_HF_REPO: "${EMBED_HF_REPO:-unsloth/embeddinggemma-2-GGUF}"
      EMBED_MODEL_FILE: "${EMBED_MODEL_FILE:-embeddinggemma-2-Q8_0.gguf}"
      EMBED_MMPROJ_FILE: "${EMBED_MMPROJ_FILE:-mmproj-Q8_0.gguf}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - ./docker/embed/entrypoint.sh:/embed/entrypoint.sh:ro
      - embed-models:/models
      # CUDA's JIT cache: without it the first request in every new container
      # takes 5-10 s.
      - embed-nvcache:/root/.nv
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s

  # embed-text: text only (no mmproj, ~0.4 GB), always loaded, so search queries
  # and zero-shot prompts never wait on a GPU cold start. Inputs are capped at
  # 1024 tokens. Optional — without it, text goes to embed-vision. To keep it
  # off the GPU entirely, add `--device none -t 4` to the command (~20 ms/query).
  embed-text:
    image: "${EMBED_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-cuda}"
    init: true
    restart: unless-stopped
    ports:
      - "${EMBED_TEXT_PORT:-18895}:8080"
    entrypoint: ["/bin/sh", "/embed/entrypoint.sh"]
    command: >
      -m /models/${EMBED_MODEL_FILE:-embeddinggemma-2-Q8_0.gguf}
      --embeddings -ngl 99
      -c 1024 --parallel 1 -b 1024 -ub 1024
      --host 0.0.0.0 --port 8080
    environment:
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      EMBED_HF_REPO: "${EMBED_HF_REPO:-unsloth/embeddinggemma-2-GGUF}"
      EMBED_MODEL_FILE: "${EMBED_MODEL_FILE:-embeddinggemma-2-Q8_0.gguf}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - ./docker/embed/entrypoint.sh:/embed/entrypoint.sh:ro
      - embed-models:/models
      - embed-nvcache:/root/.nv
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

volumes:
  # Cloned voices (npy codes + sidecars) — back this up.
  breeze-voices:
  # Model caches; safe to drop, they re-download.
  parakeet-cpp-models:
  embed-models:
  embed-nvcache:
