[package]
name = "stk-client"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-only"
description = "Native Rust client for Amazon's Send-to-Kindle service"

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
base64 = "0.23.1"
sha2 = "0.11.1"
rsa = "0.9.10"
rand = "0.10.3"
url = "2.5.8"
quick-xml = { version = "0.42.0", features = ["serialize"] }
thiserror = "2.0.21"
hex = "0.4.3"
chrono = { version = "0.4.45", features = ["serde"] }
tokio = { version = "1.54.1", features = ["fs"] }
tokio-util = { version = "0.7.20", features = ["io"] }
tracing = "0.1.44"
