# Kobbler — throwaway backing services for the integration test suite.
#
#   docker compose -f docker-compose.test.yml up -d
#   cargo test
#
# Everything is tmpfs-backed and on non-default ports (5433 / 4223 / 7701) so it
# can run beside a dev or production stack without colliding.

services:
  postgres-test:
    image: postgres:18.4
    environment:
      POSTGRES_USER: kobbler
      POSTGRES_PASSWORD: kobbler
      POSTGRES_DB: kobbler_test
    ports:
      - "5433:5432"
    shm_size: 512mb
    command: ["postgres", "-c", "max_connections=500", "-c", "shared_buffers=256MB"]
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kobbler -d kobbler_test"]
      interval: 2s
      timeout: 5s
      retries: 5

  nats-test:
    image: nats:2.14.4-alpine
    command: ["--jetstream", "--store_dir=/data", "--http_port=8222"]
    ports:
      - "4223:4222"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -q --spider http://localhost:8222/healthz || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 5

  meilisearch-test:
    image: getmeili/meilisearch:v1.54.3
    environment:
      - MEILI_MASTER_KEY=test-master-key
      - MEILI_NO_ANALYTICS=true
    ports:
      - "7701:7700"
    tmpfs:
      - /meili_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 2s
      timeout: 5s
      retries: 5
